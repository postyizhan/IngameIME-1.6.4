buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven { url "https://maven.fabricmc.net" }
        maven { url "https://repo.sleeping.town" }
    }
    dependencies {
        classpath "agency.highlysuspect:voldeloom:2.4"
    }
}
apply plugin: 'agency.highlysuspect.voldeloom'

// Forge 1.6.4 uses ASM 4.1 during mod discovery, which cannot parse Java 8 class files.
// Keep the source Java-7-compatible even when running the game on Java 8.
sourceCompatibility = '1.7'
targetCompatibility = '1.7'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

version = "1.0.0-1.6.4"
group = "com.dhj.ingameime"
archivesBaseName = "IngameIME"

volde {
    setDefaultRunToolchainVendor('AZUL')
    runs {
        client {
            property 'fml.coreMods.load', 'com.dhj.ingameime.core.IngameIMECorePlugin'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.6.4"
    forge "net.minecraftforge:forge:1.6.4-9.11.1.1345:universal"
    mappings "net.minecraftforge:forge:1.6.4-9.11.1.1345:src@zip"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'com.dhj.ingameime.core.IngameIMECorePlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
    classifier = 'universal'
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    manifest {
        attributes(
                'FMLCorePlugin': 'com.dhj.ingameime.core.IngameIMECorePlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
    classifier = 'dev'
}
