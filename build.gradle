plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version "7.0.28"
    id("net.minecraftforge.renamer") version "1.1.2"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

tasks.withType(JavaCompile) {
    options.fork = true
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-source', '1.6', '-target', '1.6']
}

// launchwrapper 1.8 的 Launch.launch() 在 JDK 8u20+ 下必抛 ConcurrentModificationException
// (详见 src/launchPatch/java/dev/launchfix/CmeSafeLaunch.java 的类注释)。
// 这里单独编译一个等价且 CME-safe 的启动器,顶替原版 Launch。
// 独立 sourceSet 而非塞进 main:避免它被打进 mod jar、也避免 FML 把它当 mod 类扫描。
sourceSets.register('launchPatch')

version = "1.0.0-1.6.4"
group = "com.dhj.ingameime"
base.archivesName = "IngameIME"

repositories {
    mavenCentral()
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    flatDir(
            dir : 'libs'
    )
}

minecraft {
    mappings channel: 'snapshot', version: '20130918-1.6.3'

    runs {
        register('client') {
            workingDir = file('runs/main/client/')
            environment.put("tweakClass", "cpw.mods.fml.common.launcher.FMLTweaker")
            jvmArgs "-Dfml.ignoreInvalidMinecraftCertificates=true", "-Dfml.coreMods.load=com.dhj.ingameime.core.IngameIMECorePlugin"
            // env 的 mainClass 是 slime-launcher LegacyDev 读取的真实入口(外层 main 仍是
            // net.minecraftforge.legacydev.MainClient,它负责补 --tweakClass/--version 等参数)。
            // 这里把默认的 net.minecraft.launchwrapper.Launch 换成 CME-safe 版本。
            environment.put("mainClass", "dev.launchfix.CmeSafeLaunch")
        }
        register('server') {
            workingDir = file('runs/main/server/')
            environment.put("tweakClass", "cpw.mods.fml.common.launcher.FMLTweaker")
            jvmArgs "-Dfml.ignoreInvalidMinecraftCertificates=true", "-Dfml.coreMods.load=com.dhj.ingameime.core.IngameIMECorePlugin"
            environment.put("mainClass", "dev.launchfix.CmeSafeLaunch")
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

// 补丁启动器只需要 launchwrapper 与 jopt-simple,直接复用 main 的编译 classpath。
sourceSets.launchPatch.compileClasspath = sourceSets.main.compileClasspath
// run 任务的 JVM classpath = slime-launcher 工具 jar + main.runtimeClasspath,
// 所以补丁类要挂到 main.runtimeClasspath 上(run DSL 的 classpath 是整体覆盖语义,不能用)。
// 该 FileCollection 自带 builtBy,runClient 会自动依赖 compileLaunchPatchJava。
// 只影响运行时:jar 打的是 sourceSets.main.output,补丁不会进发布产物。
sourceSets.main.runtimeClasspath += sourceSets.launchPatch.output

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'com.dhj.ingameime.core.IngameIMECorePlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}

renamer.mappings.from minecraft.dependency.toSrgFile

renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile

    archiveClassifier = 'srg'
}
